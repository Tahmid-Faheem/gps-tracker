<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live GPS Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    #coords { font-size: 24px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <h2>🌍 Live GPS Tracker 101</h2>
  <div id="coords">Loading GPS data...</div>

  <script>
    async function fetchLocation() {
      try {
        // Use absolute path to avoid 404
        const res = await fetch('/gps-tracker/data/location.json?nocache=' + new Date().getTime());
        const data = await res.json();
        const { lat, lon } = data;

        document.getElementById("coords").textContent = 
          `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}`;
      } catch (err) {
        console.error("Error fetching GPS data:", err);
        document.getElementById("coords").textContent = "Waiting for GPS data...";
      }
    }

    fetchLocation();
    setInterval(fetchLocation, 2000);
  </script>
</body>
</html>
