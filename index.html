<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🚗 Live GPS Tracker</title>
  <meta http-equiv="refresh" content="2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; }
    #map { height: 400px; width: 80%; margin: 20px auto; border-radius: 12px; }
    #coords { font-size: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>🌍 Live GPS Tracker</h2>
  <div id="map"></div>
  <p id="coords">Loading...</p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    async function fetchData() {
      const res = await fetch('https://raw.githubusercontent.com/Tahmid-Faheem/gps-tracker/main/data/location.json');
      const data = await res.json();

      document.getElementById("coords").innerText = 
        `Latitude: ${data.lat.toFixed(6)}, Longitude: ${data.lon.toFixed(6)}`;

      const map = L.map('map').setView([data.lat, data.lon], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
      }).addTo(map);
      L.marker([data.lat, data.lon]).addTo(map);
    }
    fetchData();
  </script>
</body>
</html>
